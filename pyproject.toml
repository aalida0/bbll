[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bbll"
version = "0.1.0"
description = "Minimal reproducible bbll phenomenology analysis"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23,<3", "uproot>=5,<6", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["bbll*", "stage1*", "stage2*", "stage3*", "stage4*", "stage5*", "stage6*"]

[tool.setuptools.package-data]
bbll = ["analysis.yaml"]
stage1 = ["config.yaml"]
stage2 = ["config.yaml"]
stage3 = ["config.yaml"]
stage4 = ["config.yaml"]
stage5 = ["config.yaml"]
stage6 = ["config.yaml"]
