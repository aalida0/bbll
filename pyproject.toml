[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bbll"
version = "0.1.0"
description = "Minimal reproducible bbll phenomenology analysis"
requires-python = ">=3.9"
dependencies = ["numpy==2.0.2", "uproot>=5,<6", "PyYAML>=6,<7", "scikit-learn==1.6.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["bbll*", "preselection*", "bdt_training*", "sr_optimization*", "fake_backgrounds*", "systematics*", "statistical_inference*"]

[tool.setuptools.package-data]
bbll = ["analysis.yaml"]
preselection = ["config.yaml"]
bdt_training = ["config.yaml"]
sr_optimization = ["config.yaml"]
fake_backgrounds = ["config.yaml"]
systematics = ["config.yaml"]
statistical_inference = ["config.yaml"]
