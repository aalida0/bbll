[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bbll"
version = "0.1.0"
description = "Minimal reproducible bbll phenomenology analysis"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23,<3", "uproot>=5,<6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["bbll*"]
